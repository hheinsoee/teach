<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course 0 — Slide Decks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Padauk", "Myanmar Text", "Noto Sans Myanmar", "Inter", system-ui, sans-serif;
            background: #0b0d12;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        main { max-width: 800px; margin: 0 auto; }
        h1 {
            color: #ffd166;
            font-size: 48px;
            margin-bottom: 10px;
        }
        h2 {
            color: #06d6a0;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 40px;
        }
        .days {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .day {
            background: #1a1d26;
            border: 1px solid #2a2d36;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.2s;
        }
        .day a {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .day:hover {
            background: #22252e;
            border-color: #ffd166;
            transform: translateY(-2px);
        }
        .day-num {
            font-size: 14px;
            color: #ffd166;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .day-title {
            font-size: 20px;
            color: #f5f5f5;
            margin-bottom: 8px;
        }
        .day-status {
            font-size: 14px;
            color: #666;
        }
        .day-status.ready { color: #06d6a0; }
        .day-status.missing { color: #666; }
        footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #2a2d36;
            color: #666;
            font-size: 14px;
        }
        footer code {
            background: #1a1d26;
            padding: 2px 8px;
            border-radius: 4px;
            color: #ffd166;
        }
    </style>
</head>
<body>

<main>
    <h1>Course 0 — Web Essentials</h1>
    <h2>Slide Decks</h2>

    <ul class="days" id="day-list"></ul>

    <footer>
        <p>Click any day with ✓ to present. Click a missing day to see a template placeholder.</p>
        <p style="margin-top:10px;">To add slides for a new day: create <code>day-NN/slides.md</code> with Markdown content (<code>---</code> separates slides).</p>
        <p style="margin-top:10px;">Guide: <a href="how-to-present.md" style="color:#06d6a0;">how-to-present.md</a></p>
    </footer>
</main>

<script>
    const days = [
        { n: 1, title: "HTML + GitHub Starter", ready: false },
        { n: 2, title: "CSS Styling", ready: false },
        { n: 3, title: "JS Variables & Data Types", ready: true },
        { n: 4, title: "Functions & Conditions", ready: false },
        { n: 5, title: "Loops + .map()", ready: false },
        { n: 6, title: "Vanilla DOM concept + React intro ⭐", ready: false },
        { n: 7, title: "React State (useState) + localStorage", ready: false },
        { n: 8, title: "React Fetch (useEffect)", ready: false },
        { n: 9, title: "Capstone 2 Begins", ready: false },
        { n: 10, title: "News App Features", ready: false },
        { n: 11, title: "Polish + Real Users", ready: false },
        { n: 12, title: "🎓 Showcase + What's Next", ready: false },
    ];

    const list = document.getElementById("day-list");
    days.forEach((d) => {
        const paddedN = String(d.n).padStart(2, "0");
        const status = d.ready ? "✓ Ready" : "⏳ Not yet";
        const statusClass = d.ready ? "ready" : "missing";
        list.innerHTML += `
            <li class="day">
                <a href="viewer.html?day=${paddedN}">
                    <div class="day-num">Day ${d.n}</div>
                    <div class="day-title">${d.title}</div>
                    <div class="day-status ${statusClass}">${status}</div>
                </a>
            </li>
        `;
    });
</script>

</body>
</html>
